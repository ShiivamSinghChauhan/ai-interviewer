[project]
name = "ai-interviewer"
version = "1.0.0"
description = "A real-time voice interviewer that reads the JD, the resume and the code, with a REST API."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["models", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
