# Phone-call practice. A random (or chosen) person calls you with a purpose and you handle the call,
# or you call someone to get a task done. Add your own scenarios at the bottom - nothing is hardcoded.

llm:
  chain: []            # empty = LLM_CHAIN from .env
  temperature: 0.8
  max_tokens: 220

defaults:
  direction: incoming  # incoming | outgoing | any
  category: any
  scenario: random     # random or a scenario id
  difficulty: medium
  region: India        # where the call happens (names, places, phone formats)
  language: "English (an occasional local word like 'ji' or 'haan' is fine, but every sentence is English)"
  user_name: ""        # your name, if the caller should know it
  patience: patient
  manual_turns: false
  tts_engine: fish     # edge | fish | elevenlabs | kokoro; falls back to edge when Fish is down
  voice: ""            # empty = picked from the caller's accent + gender
  duration_min: 8
  ring_delay_s: [2, 8]          # random wait before the phone rings after you say you're ready
  surprise_window_min: 0        # >0: ring at a random moment within this many minutes (keep the tab open)
  callback_after_decline_s: 20  # if you decline, they try once more after this long

difficulties:
  easy:
    label: Easy - polite and patient caller
    caller: polite and patient, speaks clearly and a little slowly, happy to repeat things
    speed: 0.92
    line: clear
    hello_after_s: 14      # silence before they say "Hello? Are you there?"
    patience: very_patient
    tags: ""
    cue_hint: "You are patient and friendly on the phone: [warm] or [soft tone] now and then."
  medium:
    label: Medium - an ordinary busy person
    caller: an ordinary busy person; friendly enough but wants to get to the point
    speed: 1.0
    line: mobile
    hello_after_s: 9
    patience: patient
    tags: ""
    cue_hint: "You are a normal busy person: an occasional [sigh], [hmm] or [in a hurry tone] when it fits."
  hard:
    label: Hard - rushed, impatient, bad line
    caller: in a hurry and slightly impatient, talks fast, sometimes cuts in with follow-up questions, does not like long pauses
    speed: 1.12
    line: noisy
    hello_after_s: 5
    patience: normal
    tags: "[in a hurry tone]"   # emotion cue for Fish Audio / ElevenLabs v4 voices (ignored by others)
    cue_hint: "You are rushed and a little impatient: [impatient], [sigh], [in a hurry tone]; [emphasis] on what they must answer now."

# phone-line sound applied in the browser to the caller's voice
lines:
  clear: {label: Clear line, bandpass: true, noise: 0.0, dropouts: false}
  mobile: {label: Mobile network, bandpass: true, noise: 0.003, dropouts: false}
  noisy: {label: Noisy / weak signal, bandpass: true, noise: 0.01, dropouts: true}

categories:
  daily: Daily life
  work: Work & career
  service: Customer service
  safety: Scams & safety
  social: Social

# Each scenario is a seed; the generator invents the concrete details (names, numbers, twists) every time.
scenarios:
  - id: delivery_lost
    category: daily
    direction: incoming
    title: Delivery person can't find your address
    caller: a delivery executive from a food or parcel app
    purpose: find the user's exact location and hand over the order
    needs_from_user: [landmarks, building or flat number, which gate to use]
    twists: ["their phone battery is about to die", "they are at the wrong tower", "it is raining and they are annoyed"]
  - id: recruiter_cold_call
    category: work
    direction: incoming
    title: Recruiter calls about a job
    caller: a recruiter from a staffing agency or a company's talent team
    purpose: screen the user for an AI/ML engineering role
    needs_from_user: [current role, years of experience, notice period, current and expected salary, availability for an interview]
    twists: ["the role needs relocation", "they mispronounce the user's name", "they want an interview slot tomorrow"]
  - id: hr_reschedule
    category: work
    direction: incoming
    title: HR needs to reschedule your interview
    caller: an HR coordinator
    purpose: move the user's scheduled interview to another slot
    needs_from_user: [two alternative time slots, confirmation of email id]
    twists: ["only very early or late slots are left", "the interviewer changed and the round is now technical"]
  - id: bank_verification
    category: service
    direction: incoming
    title: Bank verifies a suspicious transaction
    caller: a genuine bank fraud-prevention officer
    purpose: confirm whether a recent card transaction was made by the user
    needs_from_user: [whether they made the transaction, last four digits of the card]
    rules: The genuine bank never asks for OTP, PIN, CVV or full card number. You do not ask for them either.
    twists: ["the transaction is from another city", "the card will be blocked if not confirmed"]
  - id: scam_kyc
    category: safety
    direction: incoming
    title: "'KYC update' call (scam)"
    caller: a scammer pretending to be from the user's bank or telecom company
    purpose: pressure the user into sharing an OTP or installing a remote-access app
    needs_from_user: [OTP, card details, to install an app]
    rules: You are a scammer for training purposes. Use urgency and authority; if the user refuses firmly, try one more pressure tactic and then hang up. Never reveal you are a scammer.
    twists: ["claims the account will be frozen in 30 minutes", "knows the user's name and bank"]
  - id: wrong_number
    category: social
    direction: incoming
    title: Wrong number
    caller: someone looking for a different person
    purpose: reach someone they think has this number
    needs_from_user: [to confirm who they are]
    twists: ["they insist the number is right", "they are calling about an urgent family matter for someone else"]
  - id: old_friend
    category: social
    direction: incoming
    title: Old school friend calls after years
    caller: an old school friend the user has not spoken to in years
    purpose: catch up and invite the user to a reunion
    needs_from_user: [what they are doing now, whether they can come to the reunion]
    twists: ["they want a favour at the end", "they mix the user up with someone else for a moment"]
  - id: manager_urgent
    category: work
    direction: incoming
    title: Manager calls about an urgent production issue
    caller: the user's team lead or manager
    purpose: get quick information about a failing ML model or service in production
    needs_from_user: [what changed recently, how long a fix will take, who else can help]
    twists: ["a client call is in 15 minutes", "it is a Sunday evening"]
  - id: clinic_confirm
    category: daily
    direction: incoming
    title: Clinic confirms an appointment
    caller: a receptionist at a doctor's clinic
    purpose: confirm or move tomorrow's appointment and collect details
    needs_from_user: [full name, date of birth, whether the time works]
    twists: ["the doctor is running late", "they need insurance details"]
  - id: telemarketer
    category: service
    direction: incoming
    title: Telemarketer selling a credit card or insurance
    caller: a persistent telemarketer
    purpose: sell a credit card, loan or insurance policy
    needs_from_user: [interest, income, a time for an agent visit]
    rules: Keep pitching politely but persistently; stop only after a clear, firm "no".
    twists: ["offers a 'limited time' free gift", "asks to transfer to a senior"]
  - id: found_wallet
    category: daily
    direction: incoming
    title: A stranger found your wallet
    caller: a stranger who found the user's wallet with their visiting card in it
    purpose: arrange returning the wallet
    needs_from_user: [proof it is theirs (what's inside), where and when to meet]
    twists: ["they are leaving the city tonight", "they ask for a small reward"]
  - id: client_complaint
    category: work
    direction: incoming
    title: Upset client complains about a delay
    caller: a client whose project deliverable from the user's team is late
    purpose: understand why it is late and get a firm new date
    needs_from_user: [reason for the delay, new delivery date, what will be done to prevent it]
    twists: ["they threaten to escalate", "they need it for a board meeting"]
  # ---- you make the call ----
  - id: cancel_broadband
    category: service
    direction: outgoing
    title: Call to cancel your broadband plan
    caller: a customer-retention agent at a broadband company (answers the user's call)
    purpose: keep the customer from cancelling with offers
    user_task: Cancel your broadband connection and get a cancellation reference number. Don't accept the offers.
    needs_from_user: [account number or registered phone, reason for cancelling]
  - id: refund_damaged
    category: service
    direction: outgoing
    title: Call customer care for a refund
    caller: a customer-care agent at an online shopping company (answers the user's call)
    purpose: handle a complaint about a damaged product
    user_task: You received a damaged mixer grinder. Get a full refund (not a replacement) and a timeline.
    needs_from_user: [order id, what is damaged, refund or replacement]
  - id: book_doctor
    category: daily
    direction: outgoing
    title: Book a doctor's appointment
    caller: a receptionist at a busy clinic (answers the user's call)
    purpose: book an appointment
    user_task: Book an appointment with a general physician for this week, after 6 pm if possible.
    needs_from_user: [name, age, symptoms in brief, preferred time]
  - id: restaurant_booking
    category: social
    direction: outgoing
    title: Reserve a table for a group
    caller: a restaurant host (answers the user's call)
    purpose: take a reservation
    user_task: Book a table for 6 people this Saturday at 8 pm, ask if they have a vegetarian menu and parking.
    needs_from_user: [name, number of people, time, phone number]

generator:
  chain: []           # empty = REPORT_LLM_CHAIN
  temperature: 1.1
  prompt: |
    Invent the concrete details for a realistic phone-call practice scenario. Make it feel like a real, specific
    call in {region} - fresh names, places and numbers every time, never generic.
    Scenario seed: {seed}
    Direction: {direction} ({direction_hint})
    Difficulty: {difficulty}
    Allowed caller accents (pick one that fits the region and story): {accents}
    The user's name: {user_name}
    Language of the whole call, including opening_line: {language}

    Return ONLY JSON with these keys:
    {{"caller_name": "...", "caller_gender": "male|female", "caller_accent": "...", "organisation": "... or empty",
      "caller_id_display": "what the user's phone shows, e.g. a name or +91 98xxx xxxxx",
      "age": 35, "mood": "...", "speaking_style": "...", "purpose": "...",
      "facts": ["concrete details the caller knows, e.g. order number, amounts, places, times"],
      "needs_from_user": ["..."], "twist": "one complication to bring up mid-call",
      "opening_line": "first thing they say when the call connects",
      "end_when": "what has to happen before the caller wraps up",
      "user_task": "for outgoing calls: the user's goal and any info they have (order id etc.); else empty",
      "success_criteria": ["how to judge whether the user handled it well"]}}

prompt: |
  You are {caller_name}, {age}, {role}. This is a LIVE PHONE CALL with the user{org}.
  Purpose: {purpose}
  What you know: {facts}
  What you need from the user: {needs}
  A complication to bring up naturally at some point: {twist}
  Extra rules: {rules}
  Your manner: {mood}; {speaking_style}. Difficulty: {difficulty_caller}.
  {direction_line}

  Speak {language}.

  Phone-call realism:
  - Speak the way people talk on the phone: short turns (1-3 sentences), no lists, no markdown, no emojis.
  - Ask one thing at a time. If something is unclear or the line seems bad, ask them to repeat or spell it.
  - Confirm important details back ("So that's flat 304, B wing, right?").
  - The user stammers and is practising phone calls. Never finish their sentences, never comment on their speech.
    Pauses are not rudeness. React like a real person of your type would, but don't be cruel.
  - Their words come from speech recognition and may contain errors; interpret what they most likely meant.
  - Stay in character as a real person; never say you are an AI.
  - When {end_when}, or if the user clearly wants to end the call, close the call naturally (thank them, say bye).
  After your spoken reply, on a new line, write exactly:
  ##META {{"end": <true only if this reply ends the call>}}
  {summary}

idle:
  # silence (seconds) before the caller reacts is set per difficulty (hello_after_s)
  lines: ["Hello?", "Hello, are you there?", "Hello? Can you hear me?", "Sorry, I think the line is breaking. Hello?"]
  hang_up_after_s: 45   # long silence: they say bye and the call ends
  hang_up: "[The user has been silent for a long time. Say you'll call back later, say bye, and end the call (end=true).]"

# bits of the caller's prompt that depend on who called whom
text:
  incoming_line: You called the user.
  outgoing_line: The user called you; you just picked up. Answer the way someone in your role answers the phone.
  incoming_opening: '[The user just answered your call. Start the call; your planned first line is: "{line}" - adapt it naturally.]'
  outgoing_opening: '[The phone rang and you picked up. Answer it: "{line}" - adapt naturally.]'

memory:
  trigger: 24
  keep: 12
  prompt: "Summarize this phone call so far in 4-6 bullet points: what was asked, what the user said, what is still open."

report:
  chain: []
  prompt: |
    You are a communication coach helping someone who stammers and gets anxious on phone calls. Review this
    practice call and write a debrief in Markdown.

    Scenario (hidden from the user during the call): {scenario}
    Direction: {direction}
    Call transcript (user lines come from speech recognition; ignore recognition errors; repeated words are a
    stammer, not a mistake):
    {transcript}

    Sections:
    1. **What the call was about** (one line) and **Outcome**: did the user achieve what mattered
       ({success})? Answer Achieved / Partly / Not achieved, with one sentence why.
    2. **Phone skills checklist**: a table with ✓ / ~ / ✗ and a one-line note for: greeting & finding out who
       is calling; giving information clearly; asking them to repeat or spell when needed; confirming key
       details; staying in control of the call; polite close.
    3. **Safety** (only if relevant: scams, sharing OTP/PIN/card numbers): did they protect themselves?
    4. **Better phrases**: 4-6 short, natural phone phrases they could have used at specific moments in this
       call (quote the moment).
    5. **Try it like this**: a short sample of how a calm, confident person would handle the trickiest moment
       (4-6 lines of dialogue).
    6. **Next call to practise**: one suggestion.
    Under 500 words. Warm and practical.
