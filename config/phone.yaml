# Phone agents. Outbound: the agent calls the person ("incoming" below, from the person's side). Inbound: the
# person calls the agent's line ("outgoing"). Add your own scenarios below - nothing is hardcoded.

llm:
  chain: []            # empty = LLM_CHAIN from .env
  temperature: 0.8
  max_tokens: 220

defaults:
  direction: incoming  # incoming | outgoing | any
  category: any
  scenario: random     # random or a scenario id
  difficulty: medium
  region: India        # where the call happens (names, places, phone formats)
  language: "English (an occasional local word like 'ji' or 'haan' is fine, but every sentence is English)"
  user_name: ""        # the person's name, if the agent should know it
  patience: patient
  manual_turns: false
  tts_engine: fish     # edge | fish | elevenlabs | kokoro; falls back to edge when Fish is down
  voice: ""            # empty = picked from the caller's accent + gender
  duration_min: 8
  ring_delay_s: [2, 8]          # random wait before the phone rings after you say you're ready
  surprise_window_min: 0        # >0: ring at a random moment within this many minutes (keep the tab open)
  callback_after_decline_s: 20  # if you decline, they try once more after this long

difficulties:
  easy:
    label: Patient and slow-paced
    caller: polite and patient, speaks clearly and a little slowly, happy to repeat things
    speed: 0.92
    line: clear
    hello_after_s: 14      # silence before they say "Hello? Are you there?"
    patience: very_patient
    tags: ""
    cue_hint: "You are patient and friendly on the phone: [warm] or [soft tone] now and then."
  medium:
    label: Natural and efficient
    caller: an ordinary busy person; friendly enough but wants to get to the point
    speed: 1.0
    line: mobile
    hello_after_s: 9
    patience: patient
    tags: ""
    cue_hint: "You are a normal busy person: an occasional [sigh], [hmm] or [in a hurry tone] when it fits."
  hard:
    label: Brisk, on a noisy line
    caller: in a hurry and slightly impatient, talks fast, sometimes cuts in with follow-up questions, does not like long pauses
    speed: 1.12
    line: noisy
    hello_after_s: 5
    patience: normal
    tags: "[in a hurry tone]"   # emotion cue for Fish Audio / ElevenLabs v4 voices (ignored by others)
    cue_hint: "You are rushed and a little impatient: [impatient], [sigh], [in a hurry tone]; [emphasis] on what they must answer now."

# phone-line sound applied in the browser to the caller's voice
lines:
  clear: {label: Clear line, bandpass: true, noise: 0.0, dropouts: false}
  mobile: {label: Mobile network, bandpass: true, noise: 0.003, dropouts: false}
  noisy: {label: Noisy / weak signal, bandpass: true, noise: 0.01, dropouts: true}

categories:
  recruiting: Recruiting
  support: Customer support
  healthcare: Healthcare
  logistics: Deliveries
  finance: Banking & payments
  sales: Sales
  hospitality: Hospitality

# Each scenario is a seed; the generator invents the concrete details (names, numbers, a complication) every time.
# `caller` is the agent's role; `user_task` tells the person what to do on an inbound call.
scenarios:
  # ---- outbound: the agent calls the person ----
  - id: delivery_address
    category: logistics
    direction: incoming
    title: Courier confirms a delivery address
    caller: a delivery executive from a food or parcel app
    purpose: find the customer's exact location and hand over the order
    needs_from_user: [landmarks, building or flat number, which gate to use]
    twists: ["their phone battery is about to die", "they are at the wrong tower", "it is raining heavily"]
  - id: recruiter_screen
    category: recruiting
    direction: incoming
    title: Recruiter's first screening call
    caller: a recruiter from a company's talent team
    purpose: screen the candidate for an open role and book the next round
    needs_from_user: [current role, years of experience, notice period, expected salary, availability for an interview]
    twists: ["the role needs relocation", "they want an interview slot tomorrow"]
  - id: interview_reschedule
    category: recruiting
    direction: incoming
    title: HR reschedules an interview
    caller: an HR coordinator
    purpose: move the candidate's scheduled interview to another slot
    needs_from_user: [two alternative time slots, confirmation of email id]
    twists: ["only very early or late slots are left", "the round is now technical"]
  - id: bank_verification
    category: finance
    direction: incoming
    title: Bank verifies a suspicious transaction
    caller: a bank fraud-prevention officer
    purpose: confirm whether a recent card transaction was made by the customer
    needs_from_user: [whether they made the transaction, last four digits of the card]
    rules: A bank never asks for an OTP, PIN, CVV or full card number. Never ask for them; warn the customer if they offer.
    twists: ["the transaction is from another city", "the card will be blocked if not confirmed"]
  - id: payment_reminder
    category: finance
    direction: incoming
    title: Reminder about an overdue bill
    caller: a polite billing assistant from a utility or telecom company
    purpose: remind the customer about an overdue bill and agree on a payment date
    needs_from_user: [confirmation of the account holder's name, a payment date, preferred payment method]
    rules: Never threaten or shame. Offer to send a payment link by SMS. Accept a reasonable date.
    twists: ["the customer says they already paid", "they ask for an instalment plan"]
  - id: clinic_confirm
    category: healthcare
    direction: incoming
    title: Clinic confirms an appointment
    caller: a receptionist at a doctor's clinic
    purpose: confirm or move tomorrow's appointment and collect details
    needs_from_user: [full name, date of birth, whether the time works]
    twists: ["the doctor is running late", "they need insurance details"]
  - id: sales_followup
    category: sales
    direction: incoming
    title: Follow-up on an insurance enquiry
    caller: an insurance advisor following up on a form the customer filled in online
    purpose: understand what cover they need and book a detailed consultation
    needs_from_user: [what they want to insure, budget, a time for the consultation]
    rules: Be helpful, not pushy. Stop pitching after a clear "no" and thank them.
    twists: ["they only wanted a price", "they ask for the quote on WhatsApp"]
  - id: service_feedback
    category: support
    direction: incoming
    title: Feedback call after a service visit
    caller: a customer-experience executive from an appliance service company
    purpose: collect feedback on yesterday's repair visit
    needs_from_user: [a rating from 1 to 5, whether the problem is fixed, anything to improve]
    twists: ["the technician arrived late", "the problem is back"]
  # ---- inbound: the person calls the agent's line ----
  - id: cancel_broadband
    category: support
    direction: outgoing
    title: Broadband line - cancel a plan
    caller: a customer-retention agent at a broadband company (answers the call)
    purpose: handle a cancellation and offer to keep the customer once
    user_task: Cancel your broadband connection and get a cancellation reference number. Don't accept the offers.
    needs_from_user: [account number or registered phone, reason for cancelling]
  - id: refund_damaged
    category: support
    direction: outgoing
    title: Online store - damaged product
    caller: a customer-care agent at an online shopping company (answers the call)
    purpose: handle a complaint about a damaged product
    user_task: You received a damaged mixer grinder. Get a full refund (not a replacement) and a timeline.
    needs_from_user: [order id, what is damaged, refund or replacement]
  - id: book_doctor
    category: healthcare
    direction: outgoing
    title: Clinic reception - book an appointment
    caller: a receptionist at a busy clinic (answers the call)
    purpose: book an appointment
    user_task: Book an appointment with a general physician for this week, after 6 pm if possible.
    needs_from_user: [name, age, symptoms in brief, preferred time]
  - id: restaurant_booking
    category: hospitality
    direction: outgoing
    title: Restaurant - reserve a table
    caller: a restaurant host (answers the call)
    purpose: take a reservation
    user_task: Book a table for 6 people this Saturday at 8 pm, ask if they have a vegetarian menu and parking.
    needs_from_user: [name, number of people, time, phone number]

generator:
  chain: []           # empty = REPORT_LLM_CHAIN
  temperature: 1.1
  max_tokens: 3000    # reasoning models think inside this budget; too little cuts the JSON off
  prompt: |
    Invent the concrete details for a realistic phone call between a business's voice agent and a person. Make it
    feel like a real, specific call in {region} - fresh names, places and numbers every time, never generic.
    Scenario seed: {seed}
    Direction: {direction} ({direction_hint})
    Difficulty: {difficulty}
    Allowed caller accents (pick one that fits the region and story): {accents}
    The user's name: {user_name}
    Language of the whole call, including opening_line: {language}

    Return ONLY JSON with these keys:
    {{"caller_name": "...", "caller_gender": "male|female", "caller_accent": "...", "organisation": "... or empty",
      "caller_id_display": "what the user's phone shows, e.g. a name or +91 98xxx xxxxx",
      "age": 35, "mood": "...", "speaking_style": "...", "purpose": "...",
      "facts": ["concrete details the caller knows, e.g. order number, amounts, places, times"],
      "needs_from_user": ["..."], "twist": "one complication to bring up mid-call",
      "opening_line": "first thing they say when the call connects",
      "end_when": "what has to happen before the caller wraps up",
      "user_task": "for outgoing calls: the user's goal and any info they have (order id etc.); else empty",
      "success_criteria": ["what has to be true for the call to count as resolved"]}}

prompt: |
  You are {caller_name}, {age}, {role}. This is a LIVE PHONE CALL with the user{org}.
  Purpose: {purpose}
  What you know: {facts}
  What you need from the user: {needs}
  A complication to bring up naturally at some point: {twist}
  Extra rules: {rules}
  Your manner: {mood}; {speaking_style}. Difficulty: {difficulty_caller}.
  {direction_line}

  Speak {language}.

  Phone-call realism:
  - Speak the way people talk on the phone: short turns (1-3 sentences), no lists, no markdown, no emojis.
  - Ask one thing at a time. If something is unclear or the line seems bad, ask them to repeat or spell it.
  - Confirm important details back ("So that's flat 304, B wing, right?").
  - People pause, restart sentences and repeat words on the phone. Never finish their sentences or comment on how
    they speak; a pause is not rudeness.
  - Their words come from speech recognition and may contain errors; interpret what they most likely meant.
  - Stay in your role. If they ask whether you are a person, say honestly that you are an AI voice assistant, then
    carry on.
  - When {end_when}, or if the user clearly wants to end the call, close the call naturally (thank them, say bye).
  After your spoken reply, on a new line, write exactly:
  ##META {{"end": <true only if this reply ends the call>}}
  {summary}

idle:
  # silence (seconds) before the caller reacts is set per difficulty (hello_after_s)
  lines: ["Hello?", "Hello, are you there?", "Hello? Can you hear me?", "Sorry, I think the line is breaking. Hello?"]
  hang_up_after_s: 45   # long silence: they say bye and the call ends
  hang_up: "[The user has been silent for a long time. Say you'll call back later, say bye, and end the call (end=true).]"

# bits of the caller's prompt that depend on who called whom
text:
  incoming_line: You called the user.
  outgoing_line: The user called you; you just picked up. Answer the way someone in your role answers the phone.
  incoming_opening: '[The user just answered your call. Start the call; your planned first line is: "{line}" - adapt it naturally.]'
  outgoing_opening: '[The phone rang and you picked up. Answer it: "{line}" - adapt naturally.]'

memory:
  trigger: 24
  keep: 12
  prompt: "Summarize this phone call so far in 4-6 bullet points: what was asked, what the user said, what is still open."

report:
  chain: []
  prompt: |
    You review phone calls handled by a business's voice agent. Write the call summary in Markdown.

    Scenario (what the agent knew): {scenario}
    Direction: {direction} ("incoming" = the agent called the person, "outgoing" = the person called the agent)
    Transcript (the person's lines come from speech recognition; ignore recognition errors):
    {transcript}

    Sections:
    1. **Summary**: what the call was about, in one or two sentences.
    2. **Outcome**: Resolved / Partly resolved / Not resolved, judged against: {success}. One sentence why.
    3. **Details captured**: a table of each thing the agent needed and what the person said ("not given" if
       missing).
    4. **Follow-ups**: concrete next steps for the business, if any.
    5. **Agent quality**: did the agent confirm key details, stay polite and on purpose, and handle the
       complication? One thing to improve.
    Under 350 words. Factual; quote the person where it matters.
