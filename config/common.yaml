# Shared settings for every mode. Edit freely; files are re-read at the start of each session.

session:
  first_token_timeout_s: 6   # live replies: switch to the next model if this one hasn't started answering
  overtime_min: 5            # end a session this long after its planned length
  setup_timeout_min: 20      # close a connection that never starts a session (it holds the only live slot)

# Turn-taking presets (seconds). "very_patient" suits people who pause a lot mid-sentence (thinking, a second
# language, a stammer): those silences must not be mistaken for the end of a turn.
patience:
  very_patient:
    label: Very patient (long pauses are fine)
    pause_to_check: 0.3      # silence before the turn detector runs
    answer_gap: 2.0          # silence needed after you sound finished (long answers)
    max_pause: 4.0           # longest silence tolerated when the signals are unsure
    thinking_pause: 12.0     # after "let me think"
    quick_replies: false     # reply instantly to short answers / questions
  patient:
    label: Patient
    pause_to_check: 0.3
    answer_gap: 1.4
    max_pause: 3.2
    thinking_pause: 10.0
    quick_replies: false
  normal:
    label: Normal (like most people)
    pause_to_check: 0.22
    answer_gap: 0.7
    max_pause: 2.4
    thinking_pause: 9.0
    quick_replies: true

# Voice acting: with Fish Audio (and ElevenLabs v3/v4) the partner's text can carry [bracket] cues that the
# voice performs but never reads aloud. Off automatically for engines that would read them.
expressive:
  enabled: true
  max_cues_per_sentence: 3
  instructions: |
    YOUR VOICE CAN ACT. You may put short delivery cues in square brackets; the voice performs them and never
    reads them aloud. Write them exactly like this:
    - emotion or tone at the START of a sentence: [curious] [doubtful] [amused] [concerned] [impatient] [warm]
      [serious] [relieved] [surprised] [in a hurry tone] [soft tone]
    - human sounds anywhere: [sigh] [chuckling] [laughing] [clear throat] [inhale] [hmm]
    - [emphasis] right before the one word you stress; [break] for a short pause, [long-break] for a longer one
    Use them like a real person would: MOST replies have no cue at all; add one only where a listener would
    clearly hear it (a sigh, a laugh, a change of tone), at most one per reply, and don't repeat the same cue in
    back-to-back replies. The cue must fit the moment: never laugh or chuckle at bad news or at the user's
    difficulty, and never use a cue to mock pauses or repeated words. {hint}

# How the partner's voice SAYS words that TTS engines misread (captions and transcripts keep the real spelling).
# `all` applies to every engine; an engine's own list (fish, edge, elevenlabs, kokoro) adds to it and wins.
# Plain respellings work everywhere. Fish's <|phoneme_start|>...<|phoneme_end|> tags were tried and made
# LoRA and vLLM sound worse on s2.1-pro-free, so they are not used.
pronounce:
  all:
    Qdrant: quadrant
    QLoRA: Q-LoRA
    k8s: Kubernetes
    K8s: Kubernetes
    KV cache: K-V cache
  kokoro:
    QLoRA: Q Lora
    LoRA: Lora
    vLLM: V L L M
    LLMs: L L Ms
    LLM: L L M
    GGUF: G G U F
    GPTQ: G P T Q
    AWQ: A W Q
    RLHF: R L H F
    DPO: D P O
    GRPO: G R P O
    SFT: S F T
    PEFT: peft
    RAG: rag
    ONNX: onyx
    PyTorch: pie torch
    SQL: sequel
    HNSW: H N S W
    BM25: B M twenty five
    MoE: M O E
    FAISS: face
    APIs: A P Is
    API: A P I
    JSON: jason
    GPUs: G P Us
    GPU: G P U
    CPU: C P U
    RoPE: rope
    KV: K V
    MLOps: M L ops
    e.g.: for example
    i.e.: that is
    vs.: versus
    TTFT: time to first token

# accent -> edge-tts voices (all verified to exist). Used by conversation and phone modes.
accents:
  Indian: {male: en-IN-PrabhatNeural, female: en-IN-NeerjaNeural}
  American: {male: en-US-AndrewNeural, female: en-US-AvaNeural}
  British: {male: en-GB-RyanNeural, female: en-GB-SoniaNeural}
  Australian: {male: en-AU-WilliamMultilingualNeural, female: en-AU-NatashaNeural}
  Canadian: {male: en-CA-LiamNeural, female: en-CA-ClaraNeural}
  Irish: {male: en-IE-ConnorNeural, female: en-IE-EmilyNeural}
  New Zealand: {male: en-NZ-MitchellNeural, female: en-NZ-MollyNeural}
  Nigerian: {male: en-NG-AbeoNeural, female: en-NG-EzinneNeural}
  Kenyan: {male: en-KE-ChilembaNeural, female: en-KE-AsiliaNeural}
  South African: {male: en-ZA-LukeNeural, female: en-ZA-LeahNeural}
  Singaporean: {male: en-SG-WayneNeural, female: en-SG-LunaNeural}
  Filipino: {male: en-PH-JamesNeural, female: en-PH-RosaNeural}

# Fish Audio voice discovery. Public library voices are free to use via the API; they are found by accent
# tag. Clones of real public figures and cartoon/anime/game voices are skipped (you want an unknown person).
fish:
  language: en
  default_accent: Indian
  accent_tags:
    Indian: ["Indian Accent", "Indian English", "indian"]
    American: ["American Accent"]
    British: ["British Accent"]
    Australian: ["Australian Accent"]
    Canadian: ["Canadian Accent"]
    Irish: ["Irish Accent"]
    New Zealand: ["New Zealand Accent"]
    Nigerian: ["Nigerian Accent"]
    Kenyan: ["Kenyan Accent"]
    South African: ["South African Accent"]
    Singaporean: ["Singaporean Accent"]
    Filipino: ["Filipino Accent"]
  prefer_tags: [conversational, professional, calm, friendly, clear, measured]
  exclude_tags: [character-voice, anime, gaming, character, egirl, ASMR, celebrity, game, cartoon, animated]
  exclude_titles: [modi, gandhi, kohli, virat, babar, arjun das, trump, biden, obama, messi, neymar, ronaldo,
                   shah rukh, srk, amitabh, salman, ranveer, sachin, dhoni, imran khan, elon, miku, gojo,
                   antonelli, bonnie blue, rogan, whistledown]
  exclude_title_words: [test, sample, copy, clone, me, my voice]
  # generic, descriptive titles ("Indian lady voice", "male narrator") are usually not clones of a real person
  generic_title_words: [voice, lady, woman, man, male, female, girl, boy, narrator, narration, indian, accent,
                        english, professional, calm, friendly, teacher, customer, support, agent, assistant]
  min_uses: 200
  pinned: {}          # e.g. {Indian-male: <reference_id>} to always use a voice you like

# ---- delivery metrics for the person talking to the agent (pace, response time, pauses, fillers) ----
analysis:
  enabled: true
  # Whisper's second transcript keeps fillers when its prompt has them (it copies the prompt's style)
  verbatim_prompt: "Umm, so, uh, we were, like, um... trying to finish it. Hmm."
  long_pause_s: 1.0                  # silences this long inside an answer count as long pauses
  fillers: [um, uh, umm, uhh, erm, er, ah, hmm]
